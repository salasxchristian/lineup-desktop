# Builds Lineup for Windows (zip + installer) and macOS (zipped .app).
# A v* tag publishes a GitHub Release with the files; a manual run only keeps them as artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The app reports the pubspec version to the updater, so a tag must match it.
          p="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$p" != "$v" ]]; then echo "::error::Tag v$v but pubspec.yaml says $p"; exit 1; fi
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\Lineup-${{ steps.v.outputs.version }}-windows-x64.zip"
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.v.outputs.version }}" windows\installer.iss
          Copy-Item build\installer\*.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The app reports the pubspec version to the updater, so a tag must match it.
          p="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$p" != "$v" ]]; then echo "::error::Tag v$v but pubspec.yaml says $p"; exit 1; fi
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Lineup.app "dist/Lineup-${{ steps.v.outputs.version }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
